<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A1A"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00CC"/>
      <stop offset="50%" style="stop-color:#FF0055"/>
      <stop offset="100%" style="stop-color:#CC0044"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFCC"/>
      <stop offset="100%" style="stop-color:#00F0FF"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9D00FF"/>
      <stop offset="100%" style="stop-color:#7000FF"/>
    </linearGradient>

    <pattern id="cyberGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1A1A3A" stroke-width="0.5"/>
    </pattern>

    <filter id="neonGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feGaussianBlur stdDeviation="12" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" ry="48" fill="url(#bgGradient)"/>
  <rect width="256" height="256" rx="48" ry="48" fill="url(#cyberGrid)" opacity="0.5"/>

  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="none" stroke="url(#neonPurple)" stroke-width="1" opacity="0.3"/>
  <rect x="12" y="12" width="232" height="232" rx="36" ry="36" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.2"/>

  <g transform="translate(128, 128)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1A1A3A" stroke-width="10"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#neonPink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339 452" stroke-dashoffset="56" transform="rotate(-90)" filter="url(#neonGlow)"/>

    <g transform="translate(0, -88)">
      <path d="M 0 16 L -22 -10 L 22 -10 Z" fill="#00FF66" filter="url(#neonGlow)"/>
      <line x1="0" y1="-10" x2="0" y2="22" stroke="#00FF66" stroke-width="4" opacity="0.8"/>
      <text x="-42" y="-86" font-family="monospace" font-size="14" fill="#00FF66" opacity="0.8">0</text>
      <text x="32" y="-86" font-family="monospace" font-size="14" fill="#00FF66" opacity="0.8">1</text>
    </g>

    <circle cx="0" cy="0" r="36" fill="#0A0A1A" stroke="url(#neonCyan)" stroke-width="3" filter="url(#outerGlow)"/>
    <circle cx="0" cy="0" r="24" fill="url(#neonPink)" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" opacity="0.95"/>

    <g stroke="#00F0FF" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-88" x2="0" y2="-96"/>
      <line x1="60" y1="-50" x2="68" y2="-50"/>
      <line x1="60" y1="50" x2="68" y2="50"/>
      <line x1="0" y1="88" x2="0" y2="96"/>
      <line x1="-60" y1="50" x2="-68" y2="50"/>
      <line x1="-60" y1="-50" x2="-68" y2="-50"/>
    </g>

    <g stroke="#00F0FF" stroke-width="0.5" opacity="0.15">
      <line x1="-30" y1="-30" x2="30" y2="30"/>
      <line x1="30" y1="-30" x2="-30" y2="30"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="-40" x2="0" y2="40"/>
    </g>
  </g>

  <g>
    <line x1="50" y1="220" x2="206" y2="220" stroke="#1A1A3A" stroke-width="8" stroke-linecap="round"/>
    <line x1="50" y1="220" x2="110" y2="220" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>
    <line x1="50" y1="220" x2="206" y2="220" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,6" opacity="0.4"/>

    <g transform="translate(50, 220)">
      <circle r="6" fill="#00FF66" filter="url(#neonGlow)"/>
      <rect x="-2.5" y="-2.5" width="5" height="5" fill="#0A0A1A" transform="rotate(45)"/>
    </g>

    <g transform="translate(110, 220)">
      <circle r="8" fill="#00F0FF" filter="url(#neonGlow)"/>
      <circle r="4" fill="#0A0A1A"/>
      <circle r="2" fill="#00F0FF"/>
      <circle r="12" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.4"/>
    </g>

    <g transform="translate(206, 220)">
      <circle r="5" fill="#444466"/>
      <circle r="2.5" fill="#0A0A1A"/>
    </g>
  </g>

  <g fill="#00F0FF" opacity="0.4">
    <rect x="20" y="20" width="12" height="2"/>
    <rect x="20" y="24" width="8" height="2"/>
    <rect x="224" y="20" width="12" height="2"/>
    <rect x="228" y="24" width="8" height="2"/>
    <rect x="20" y="234" width="8" height="2"/>
    <rect x="20" y="238" width="12" height="2"/>
    <rect x="228" y="234" width="8" height="2"/>
    <rect x="224" y="238" width="12" height="2"/>
  </g>

  <circle cx="230" cy="230" r="4" fill="#00FF66" filter="url(#neonGlow)" opacity="0.8"/>
</svg>

